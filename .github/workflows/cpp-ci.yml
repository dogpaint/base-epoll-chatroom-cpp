name: CI/CD - Cross-Platform Chatroom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  CTEST_TIMEOUT: 300

jobs:
  # ── Linux (GCC) ──────────────────────────────────────────────────
  linux-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq g++ cmake libgtest-dev googletest

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -E "StressTest" --timeout $CTEST_TIMEOUT

      - name: Stress tests (full)
        run: ctest --test-dir build --output-on-failure -R "StressTest" --timeout $CTEST_TIMEOUT

      - name: Validate performance
        run: python3 scripts/validate_performance.py build/tests/stress_test_report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report-linux
          path: build/tests/stress_test_report.json

  # ── macOS (Apple Clang) ──────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake googletest

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -E "StressTest" --timeout $CTEST_TIMEOUT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat_server-macos
          path: build/chat_server

  # ── Windows (MSVC) ───────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Google Test
        run: |
          git clone https://github.com/google/googletest.git --depth 1
          cd googletest && mkdir bld && cd bld
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          cmake --install . --prefix ${{ github.workspace }}\gtest

      - name: Configure
        run: |
          cmake -B build -DBUILD_TESTS=ON `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\gtest" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure -E "StressTest" --timeout $CTEST_TIMEOUT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat_server-windows
          path: build\Release\chat_server.exe

  # ── Performance gate ─────────────────────────────────────────────
  perf-gate:
    needs: [linux-gcc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download perf report
        uses: actions/download-artifact@v4
        with:
          name: perf-report-linux
          path: report/

      - name: Validate thresholds
        run: |
          python3 scripts/validate_performance.py report/stress_test_report.json
          echo "::notice::Performance gate PASSED"